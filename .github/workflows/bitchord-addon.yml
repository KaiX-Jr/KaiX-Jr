name: BitChord Lossless Addon

on:
  push:
    branches: [main]
    paths:
      - "bitchord-addon/**"
      - ".github/workflows/bitchord-addon.yml"
  pull_request:
    paths:
      - "bitchord-addon/**"
      - ".github/workflows/bitchord-addon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate addon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitchord-addon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bitchord-addon/package.json

      - name: Syntax check
        run: node --check src/index.js

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Cloudflare Worker
    needs: validate
    if: github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitchord-addon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bitchord-addon
          command: deploy
